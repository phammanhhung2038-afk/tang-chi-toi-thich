<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gửi chị ánh cuti của em 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #e4d5ff);
            overflow: hidden;
            padding: 15px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 28px 18px;
            text-align: center;
            background: rgba(255,255,255,0.94);
            border-radius: 25px;
            box-shadow: 0 10px 35px #b56b9b55;
            position: relative;
            z-index: 1;
        }

        .heart {
            font-size: 48px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #ff4f91;
            font-size: clamp(22px, 6vw, 27px);
        }

        p {
            color: #79536a;
            line-height: 1.7;
            font-size: 15px;
        }

        .question {
            color: #ff4f91;
            line-height: 1.6;
            font-size: 18px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            min-height: 55px;
        }

        button {
            border: none;
            padding: 14px 17px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #yes {
            background: #ff5c9d;
            color: white;
            position: relative;
            z-index: 2;
        }

        #think {
            background: #eee5ff;
            color: #8a59b5;
            position: relative;
            z-index: 5;
            transform-origin: center;
            transition: left 0.2s, top 0.2s, transform 0.2s;
        }

        #message {
            color: #ff4f91;
            font-weight: bold;
            margin-top: 20px;
            line-height: 1.7;
        }

        .floating {
            position: fixed;
            bottom: -40px;
            pointer-events: none;
            animation: fly 5s linear forwards;
            z-index: 0;
        }

        @keyframes fly {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 22px 12px;
            }

            .buttons {
                gap: 8px;
            }

            button {
                padding: 12px 13px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="heart">💗</div>

        <h1>Gửi chị ánh cuti của em 🌷</h1>

        <p>
            Nhân ngày 20/10, em chúc chị luôn xinh đẹp,
            vui vẻ và hạnh phúc nhé, và sớm có được em nha 💐
            <br><br>
            Có một điều em muốn nói với chịiiiii...
        </p>

        <h3 class="question">
            Chị đồng ý làm cho em tìm hiểu chị nhé? 🥺💗
        </h3>

        <div class="buttons" id="buttons">
            <button id="yes">Chị đồng ý 💖</button>
            <button id="think">Để chị suy nghĩ 🤔</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const yes = document.getElementById("yes");
        const think = document.getElementById("think");
        const message = document.getElementById("message");

        let level = 0;

        yes.addEventListener("click", function () {
            // Sửa lỗi xuống hàng của chuỗi ký tự bằng cách dùng template literals (dấu backtick `)
            message.innerHTML = `Aaaaa, em vui lắm luôn á! 🥹💗<br>Cảm ơn chị đã cho em cơ hội nhé! 🌷💕`;

            for (let i = 0; i < 15; i++) {
                setTimeout(createHeart, i * 100);
            }
        });

        function moveButton() {
            level++;

            const messages = [
                "Ơ kìa chị 😂 cho em cơ hội đi mà!",
                "Chị ơi, đừng né em chứ 🥹",
                "Nút bé lại rồi nhưng tình cảm em vẫn to 💗",
                "Chị bấm đồng ý đi màaaa 😭💕",
                "Em vẫn chờ câu trả lời của chị nha 🌷"
            ];

            message.innerText = messages[Math.min(level - 1, messages.length - 1)];

            // Chuyển nút sang vị trí cố định trên màn hình
            think.style.position = "fixed";

            // Thu nhỏ theo từng lần bấm, tối đa còn 20%
            const scale = Math.max(0.2, 1 - level * 0.15);
            // Sửa lỗi cú pháp truyền biến vào chuỗi CSS ban đầu
            think.style.transform = `scale(${scale})`;

            // Đo kích thước thật của nút trước khi thu nhỏ
            const rect = think.getBoundingClientRect();
            const width = think.offsetWidth * scale;
            const height = think.offsetHeight * scale;

            // Giữ nút trong phạm vi màn hình trên cả điện thoại và PC
            const margin = 8;
            const maxX = Math.max(margin, window.innerWidth - width - margin);
            const maxY = Math.max(margin, window.innerHeight - height - margin);

            const x = margin + Math.random() * Math.max(0, maxX - margin);
            const y = margin + Math.random() * Math.max(0, maxY - margin);

            think.style.left = x + "px";
            think.style.top = y + "px";
        }

        // Dùng sự kiện click: hỗ trợ cả chuột máy tính và chạm màn hình
        think.addEventListener("click", moveButton);

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "floating";
            heart.innerText = ["💗", "💖", "💕", "🌸"][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (20 + Math.random() * 20) + "px";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6500);
        }

        setInterval(createHeart, 600);

        // Đưa nút đang di chuyển về trong màn hình khi xoay điện thoại
        window.addEventListener("resize", function () {
            if (think.style.position === "fixed") {
                const scale = Math.max(0.2, 1 - level * 0.15);
                const width = think.offsetWidth * scale;
                const height = think.offsetHeight * scale;

                think.style.left = Math.max(8, Math.min(parseFloat(think.style.left) || 8, window.innerWidth - width - 8)) + "px";
                think.style.top = Math.max(8, Math.min(parseFloat(think.style.top) || 8, window.innerHeight - height - 8)) + "px";
            }
        });
    </script>
</body>
</html>
